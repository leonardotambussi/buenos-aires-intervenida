<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUENOS AIRES INTERVENIDA</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

#inicio{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
}

h2{
    font-weight:300;
    color:#ccc;
}

button{
    padding:15px 30px;
    margin-top:30px;
    font-size:18px;
    cursor:pointer;
}

#galeria{
    display:none;
}

img{
    max-width:90vw;
    max-height:85vh;
    margin-top:20px;
}

.nav{
    margin:20px;
    font-size:18px;
}

a{
    color:white;
    text-decoration:none;
    padding:15px;
}

.contador{
    margin-top:10px;
    color:#ccc;
}

</style>

</head>

<body>

<div id="inicio">
    <h1>BUENOS AIRES INTERVENIDA</h1>
    <h2>13 miradas sobre la ciudad</h2>
    <p>Leonardo Tambussi</p>
    <button onclick="entrar()">Ingresar a la muestra</button>
</div>

<div id="galeria">

<div class="contador" id="contador"></div>



<div class="nav">
    #◀ Anterior</a>
    |
    #Siguiente ▶</a>
</div>

</div>

<script>

const obras = [

"01. Retiro Torre IRSA.png",
"02. Palermo Torre Qiub.png",
"03. Barrio Chino Mc Donalds.png",
"04. Ciudad Universitaria FADU.png",
"05. BA_Edificio Bencich.png",
"06. BA_Edificio Kavanagh.png",
"07. BA_Puerto Madero.png",
"08. BA_Trust Relojero.png",
"09. BA_Floralis Generica.png",
"10. BA_MALBA Puertos.png",
"11. BA_Puerto Madero.png",
"12. Ciudad Universitaria Cero + Infinito.png",
"12. Ciudad Universitaria Exactas.png",
"13. BA_Biblioteca Nacional.png"

];

let actual = 0;

function entrar(){
    document.getElementById("inicio").style.display="none";
    document.getElementById("galeria").style.display="block";
    mostrar();
}

function mostrar(){
    document.getElementById("obra").src = obras[actual];
    document.getElementById("contador").innerHTML =
    (actual+1) + " / " + obras.length;
}

function siguiente(){
    actual++;
    if(actual >= obras.length) actual = 0;
    mostrar();
}

function anterior(){
    actual--;
    if(actual < 0) actual = obras.length-1;
    mostrar();
}

document.addEventListener("keydown", function(e){
    if(e.key==="ArrowRight") siguiente();
    if(e.key==="ArrowLeft") anterior();
});

</script>

</body>
</html>
